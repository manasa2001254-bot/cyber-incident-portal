<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Report New Incident</title>

    <!-- Cybersecurity Theme -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Header -->
    <header>

        <div>
            <h1>🛡️ Cyber Incident Portal</h1>

            <div class="subtitle">
                Secure Incident Response & Management System
            </div>
        </div>

        <div class="shield">
            🔐
        </div>

    </header>


    <!-- Main Content -->
    <div class="container">

        <div class="card">

            <h2>🚨 Report New Incident</h2>

            <p>
                Enter the incident details and upload evidence if available.
            </p>


            <!-- Incident Form -->
            <form th:action="@{/incidents/save}"
                  th:object="${incident}"
                  method="post"
                  enctype="multipart/form-data">

                <label>Title:</label>

                <input type="text"
                       th:field="*{title}"
                       placeholder="Enter incident title"
                       required>


                <label>Status:</label>

                <select th:field="*{status}">

                    <option value="OPEN">OPEN</option>

                    <option value="INVESTIGATING">
                        INVESTIGATING
                    </option>

                    <option value="CONTAINED">
                        CONTAINED
                    </option>

                    <option value="RESOLVED">
                        RESOLVED
                    </option>

                </select>


                <label>Severity:</label>

                <select th:field="*{severity}">

                    <option value="LOW">LOW</option>

                    <option value="MEDIUM">MEDIUM</option>

                    <option value="HIGH">HIGH</option>

                    <option value="CRITICAL">CRITICAL</option>

                </select>


                <label>Description:</label>

                <textarea th:field="*{description}"
                          rows="6"
                          placeholder="Describe the security incident...">
                </textarea>


                <label>Evidence File:</label>

                <input type="file"
                       name="evidenceFile">


                <br><br>

                <button type="submit">
                    💾 Save Incident
                </button>

            </form>

            <br>

            <a href="/incidents" class="button">
                ← Back to Dashboard
            </a>

        </div>


        <!-- Footer -->
        <footer>

            🛡️ Cyber Incident Portal |
            AWS Cloud-Based Security Application

        </footer>

    </div>

</body>

</html>
